<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Perguntas Frequentes · SEI Bahia Capacitação</title>
  <meta name="description" content="Central de Perguntas Frequentes (FAQ) do SEI Bahia para capacitação de servidores municipais. Tire suas dúvidas sobre acesso, processos, documentos, blocos e usuários externos.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ee6a1f'%3E%3Cpath d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/%3E%3Cpolyline points='14 2 14 8 20 8' fill='none' stroke='%23ffffff' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- CSS Separado -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/faq.css">
</head>
<body>

<div class="card">
  <!-- Cabeçalho Institucional Compartilhado -->
  <header>
    <a href="index.html" class="brand" aria-label="Ir para a página inicial">
      <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline>
        <line x1="16" y1="13" x2="8" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
        <line x1="16" y1="17" x2="8" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
        <polyline points="10 9 9 9 8 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"></polyline>
      </svg>
      <span>SEI BAHIA · CAPACITAÇÃO</span>
    </a>

    <nav aria-label="Navegação Principal">
      <a href="index.html">INÍCIO</a>
      <a href="sobre.html">SOBRE</a>
      <a href="apostila.html">APOSTILA</a>
      <a href="faq.html" aria-current="page">FAQ</a>
    </nav>

    <div class="header-actions">
      <span class="hello">OLÁ, <b>SERVIDOR(A)</b></span>
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="Alternar tema claro e escuro" title="Alternar tema">
        <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Conteúdo da Página FAQ -->
  <main class="faq-main" id="faq">
    <!-- Coluna Esquerda: Busca, Filtros e Acordeão -->
    <section class="faq-col" aria-labelledby="faq-title">
      <div class="badge-sub">Guia Prático do Servidor</div>
      <h1 id="faq-title">Perguntas<br>Frequentes</h1>

      <!-- Campo de Busca -->
      <div class="search-wrap">
        <label class="search" for="busca">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M21 21l-4.35-4.35"></path>
          </svg>
          <input
            id="busca"
            type="search"
            placeholder="Busque sua dúvida aqui (ex.: assinatura, anexar, retorno...)"
            aria-label="Buscar dúvida no FAQ"
            autocomplete="off"
            spellcheck="false"
          >
          <button type="button" class="clear-btn" id="clearBtn" aria-label="Limpar campo de busca" title="Limpar busca">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </label>
      </div>

      <!-- Filtros por Tema (Chips) -->
      <div class="chips-container">
        <div class="chips" id="chips" role="group" aria-label="Filtrar perguntas por tema"></div>
      </div>

      <!-- Metadados da Lista: Contagem de resultados e botão Expandir/Recolher -->
      <div class="list-meta">
        <span id="resultsCount" aria-live="polite">Carregando perguntas...</span>
        <button type="button" class="toggle-all-btn" id="toggleAllBtn">Expandir todas</button>
      </div>

      <!-- Lista do Acordeão -->
      <div class="list" id="lista" role="region" aria-label="Lista de dúvidas frequentes"></div>

      <!-- Estado Vazio (Sem Resultados) -->
      <div class="empty-state" id="vazio" hidden aria-live="assertive">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
        <h4>Nenhuma pergunta encontrada</h4>
        <p>Não encontramos resultados para o termo digitado. Tente palavras mais simples ou redefina os filtros aplicados.</p>
        <button type="button" class="reset-search-btn" id="resetSearchBtn">
          Limpar busca e filtros
        </button>
      </div>
    </section>

    <!-- Coluna Direita: Ilustração Vetorial, FAQ Gigante e Elementos Decorativos -->
    <div class="hero" aria-hidden="true">
      <!-- Folhas de fundo decorativas -->
      <svg class="deco-leaf leaf-top-left" viewBox="0 0 40 70">
        <path d="M20 0 C38 18, 38 50, 20 70 C2 50, 2 18, 20 0 Z"></path>
      </svg>
      <svg class="deco-leaf leaf-top-right" viewBox="0 0 40 70">
        <path d="M20 0 C38 18, 38 50, 20 70 C2 50, 2 18, 20 0 Z"></path>
      </svg>
      <svg class="deco-leaf leaf-mid-bg" viewBox="0 0 40 70">
        <path d="M20 0 C38 18, 38 50, 20 70 C2 50, 2 18, 20 0 Z"></path>
      </svg>

      <!-- Pontos de interrogação flutuantes -->
      <span class="qm qm-primary">?</span>
      <span class="qm qm-secondary">?</span>

      <!-- Letras FAQ Gigantes em Mármore Bege -->
      <div class="big-faq">FAQ</div>

      <!-- Mulher de pé com a mão no queixo (Ilustração SVG Vetorial Refinada) -->
      <svg class="hero-character" viewBox="0 0 220 400" preserveAspectRatio="xMidYMax meet">
        <defs>
          <linearGradient id="blazerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f7cb45" />
            <stop offset="100%" stop-color="#e09e1e" />
          </linearGradient>
          <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#343d6c" />
            <stop offset="100%" stop-color="#242b50" />
          </linearGradient>
          <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2c2838" />
            <stop offset="100%" stop-color="#191624" />
          </linearGradient>
        </defs>

        <!-- Sombra no Chão -->
        <ellipse cx="110" cy="388" rx="72" ry="10" fill="#1b1d2e" opacity="0.18" />

        <!-- Cabelo por trás -->
        <path d="M72 88 C60 120 62 165 74 185 C84 170 82 135 84 105 Z" fill="url(#hairGrad)" />

        <!-- Calça e Pernas -->
        <g id="legs">
          <path d="M104 220 L115 358 L138 358 L132 220 Z" fill="url(#pantsGrad)" />
          <path d="M78 220 L72 358 L96 358 L99 220 Z" fill="url(#pantsGrad)" />
          <line x1="84" y1="235" x2="84" y2="340" stroke="#1c213d" stroke-width="1.8" stroke-linecap="round" opacity="0.5" />
          <line x1="124" y1="235" x2="126" y2="340" stroke="#1c213d" stroke-width="1.8" stroke-linecap="round" opacity="0.5" />
        </g>

        <!-- Sapatos Elegantes -->
        <g id="shoes">
          <path d="M64 358 C64 358 64 374 74 374 L100 374 C104 374 102 358 102 358 Z" fill="#181b2f" />
          <path d="M64 372 L102 372" stroke="#ee6a1f" stroke-width="2.5" />
          <path d="M110 358 C110 358 110 374 122 374 L146 374 C150 374 148 358 148 358 Z" fill="#181b2f" />
          <path d="M110 372 L148 372" stroke="#ee6a1f" stroke-width="2.5" />
        </g>

        <!-- Tronco / Camisa Branca / Blazer Mostarda -->
        <g id="torso">
          <path d="M88 120 L126 120 L130 220 L84 220 Z" fill="#fdfefe" />
          <path d="M98 120 L107 150 L116 120 Z" fill="#e8a87c" />

          <!-- Crachá SEI no cordão -->
          <path d="M103 136 L99 176 L111 176 Z" stroke="#ee6a1f" stroke-width="1.2" fill="none" opacity="0.8" />
          <rect x="98" y="176" width="14" height="20" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
          <rect x="100" y="179" width="10" height="4" rx="1" fill="#ee6a1f" />
          <line x1="100" y1="187" x2="108" y2="187" stroke="#64748b" stroke-width="1" />
          <line x1="100" y1="190" x2="106" y2="190" stroke="#64748b" stroke-width="1" />

          <!-- Blazer Mostarda -->
          <path d="M74 128 C68 155 70 200 75 224 L101 224 L96 142 Z" fill="url(#blazerGrad)" />
          <path d="M136 128 C144 158 140 200 135 224 L110 224 L116 142 Z" fill="url(#blazerGrad)" />
          <path d="M96 130 L74 186 L98 186 Z" fill="#e09e1e" />
          <path d="M116 130 L138 186 L114 186 Z" fill="#e09e1e" />
          <path d="M78 220 L132 220 L130 227 L80 227 Z" fill="#1e243d" />
          <rect x="101" y="218" width="10" height="9" rx="1" fill="#f7cb45" />
        </g>

        <!-- Braço Esquerdo (apoiado na cintura) -->
        <g id="leftArm">
          <path d="M75 130 L56 182 L70 190 L84 140 Z" fill="url(#blazerGrad)" />
          <path d="M56 182 L84 198 L88 186 L68 174 Z" fill="url(#blazerGrad)" />
          <ellipse cx="88" cy="192" rx="7" ry="6" fill="#e8a87c" />
        </g>

        <!-- Pescoço -->
        <path d="M98 100 L114 100 L114 124 L98 124 Z" fill="#df9b6f" />

        <!-- Cabeça e Rosto -->
        <g id="head">
          <path d="M90 62 C88 95 96 108 107 108 C118 108 126 95 124 62 C123 38 91 38 90 62 Z" fill="#e8a87c" />
          <ellipse cx="123" cy="74" rx="4.5" ry="7" fill="#e8a87c" />
          <circle cx="123" cy="77" r="1.5" fill="#f7cb45" />

          <!-- Expressão Facial Pensativa -->
          <path d="M95 58 Q100 54 104 57" stroke="#2c2838" stroke-width="1.8" stroke-linecap="round" fill="none" />
          <path d="M110 57 Q115 54 120 58" stroke="#2c2838" stroke-width="1.8" stroke-linecap="round" fill="none" />
          <ellipse cx="100" cy="65" rx="2.5" ry="3.2" fill="#2c2838" />
          <circle cx="101" cy="64" r="1" fill="#ffffff" />
          <ellipse cx="115" cy="65" rx="2.5" ry="3.2" fill="#2c2838" />
          <circle cx="116" cy="64" r="1" fill="#ffffff" />
          <path d="M106 67 L105 74 L108 75" stroke="#cc8557" stroke-width="1.4" stroke-linecap="round" fill="none" />
          <path d="M101 84 Q107 90 114 84" stroke="#c05f3b" stroke-width="2" stroke-linecap="round" fill="none" />
        </g>

        <!-- Coque e Cabelo Frontal -->
        <g id="hairFront">
          <ellipse cx="108" cy="28" rx="20" ry="16" fill="url(#hairGrad)" />
          <path d="M96 28 C104 22 116 22 122 28" stroke="#ee6a1f" stroke-width="3" stroke-linecap="round" fill="none" />
          <path d="M88 56 C94 40 118 36 126 52 C120 44 102 46 92 56 Z" fill="url(#hairGrad)" />
          <path d="M88 56 C86 70 88 88 92 98 C88 84 86 68 88 56 Z" fill="url(#hairGrad)" />
        </g>

        <!-- Braço Direito com a MÃO NO QUEIXO -->
        <g id="rightArmThoughtful">
          <path d="M132 130 L152 180 L138 188 L122 138 Z" fill="url(#blazerGrad)" />
          <path d="M152 180 L124 104 L114 110 L138 188 Z" fill="url(#blazerGrad)" />
          <path d="M114 110 L124 104 L126 109 L116 115 Z" fill="#e09e1e" />

          <!-- Mão no queixo -->
          <ellipse cx="118" cy="98" rx="7" ry="6" fill="#e8a87c" />
          <path d="M114 98 C112 90 111 82 113 78 C115 77 118 78 118 84 L117 96 Z" fill="#e8a87c" />
          <path d="M112 98 Q106 97 103 94 C102 92 105 91 108 93 Q112 95 116 97 Z" fill="#df9b6f" />
        </g>
      </svg>
    </div>
  </main>

  <!-- Folhagens Decorativas nos Cantos Inferiores do Cartão -->
  <div class="foot-foliage" aria-hidden="true">
    <svg class="foliage-left" viewBox="0 0 240 100">
      <path d="M0 100 L0 52 C16 40 28 60 42 44 C52 18 72 4 84 32 C90 48 104 34 116 44 C132 58 150 36 168 52 C182 66 202 56 218 72 C228 82 234 94 240 100 Z"></path>
      <path d="M12 100 C30 50 65 55 90 90 C60 88 40 92 12 100 Z" opacity="0.6"></path>
    </svg>
    <svg class="foliage-right" viewBox="0 0 240 100">
      <path d="M0 100 L0 52 C16 40 28 60 42 44 C52 18 72 4 84 32 C90 48 104 34 116 44 C132 58 150 36 168 52 C182 66 202 56 218 72 C228 82 234 94 240 100 Z"></path>
      <path d="M12 100 C30 50 65 55 90 90 C60 88 40 92 12 100 Z" opacity="0.6"></path>
    </svg>
  </div>
</div>
